# Production stack for the Lightsail server. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
# The API listens only on 127.0.0.1:8010; Caddy on the host terminates HTTPS for jobs.aicruit.in.
# Memory limits keep the stack inside the 2 GB instance it shares with the invoice agent.

name: jobagent

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: jobagent:latest
  env_file: ../.env.prod
  environment:
    DATABASE_URL: postgresql+psycopg://jobagent:${POSTGRES_PASSWORD}@db:5432/jobagent
    COOKIE_SECURE: "true"
  volumes:
    - model-cache:/cache
    - ../data:/data:ro
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobagent
    command: >
      postgres -c shared_buffers=96MB -c work_mem=6MB
               -c maintenance_work_mem=48MB -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      retries: 10
    mem_limit: 320m

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"
    mem_limit: 256m

  api:
    <<: *app
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m

  worker:
    <<: *app
    command: ["jobagent", "worker"]
    healthcheck:
      disable: true  # the image's check probes the API's HTTP port; the worker has none
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Embedding model + LLM pipeline; the heaviest service, busy ~30 min a day.
    mem_limit: 900m

volumes:
  pgdata:
  model-cache:
