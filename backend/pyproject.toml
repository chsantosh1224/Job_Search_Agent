[project]
name = "job-search-agent"
version = "0.1.0"
description = "Personal agent that finds and ranks remote startup jobs and prepares research briefs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "fastembed>=0.4",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "langgraph>=0.2",
    "openai>=1.55",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
jobagent = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (docker compose up -d db)"]

[tool.ruff]
line-length = 100
target-version = "py312"
