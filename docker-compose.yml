services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    # Tuned for the shared 2 GB Lightsail instance.
    command: >
      postgres -c shared_buffers=128MB -c work_mem=8MB
               -c maintenance_work_mem=64MB -c max_connections=30
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
